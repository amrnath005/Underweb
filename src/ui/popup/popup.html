<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <title>Underweb — Architecture Exoskeleton</title>
  <link rel="stylesheet" href="../styles/theme.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">

    <!-- HEADER -->
    <header class="popup-header">
      <div class="brand">
        <img src="../../../assets/branding/scorpion.png" alt="Underweb" width="22" height="22" style="object-fit: contain;">
        <div class="brand-text">
          <span class="brand-name">UNDERWEB</span>
          <span class="brand-tagline">Architecture Exoskeleton</span>
        </div>
      </div>
      <div class="header-right">
        <button id="themeToggleBtn" class="btn-theme" title="Toggle theme">
          <svg id="popupThemeIcon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
        </button>
        <div id="protocolBadge" class="badge badge-amber">TLS 1.3</div>
      </div>
    </header>

    <!-- SITE BAR -->
    <div class="site-bar">
      <div class="site-host-wrap">
        <span id="siteProtocol" class="site-protocol">https://</span>
        <span id="siteHostname" class="site-host">Scanning substrate...</span>
      </div>
      <span id="securityBadge" class="badge badge-green">Secure</span>
    </div>

    <!-- METRICS GRID -->
    <div class="metrics-grid">
      <div class="metric-card">
        <span class="metric-val" id="totalRequests">0</span>
        <span class="metric-label">Requests</span>
      </div>
      <div class="metric-card">
        <span class="metric-val" id="domainsCount">0</span>
        <span class="metric-label">Domains</span>
      </div>
      <div class="metric-card">
        <span class="metric-val" id="thirdPartyCount">0</span>
        <span class="metric-label">3rd Party</span>
      </div>
      <div class="metric-card">
        <span class="metric-val" id="apiCount">0</span>
        <span class="metric-label">APIs</span>
      </div>
    </div>

    <!-- STACK -->
    <div class="section-block">
      <div class="section-title">
        <span>Detected Stack</span>
        <span id="techCountBadge" class="badge badge-neutral">0 Techs</span>
      </div>
      <div id="techBadgesContainer" class="badges-row">
        <span class="empty-state-text">Probing runtime signatures...</span>
      </div>
    </div>

    <!-- INFRASTRUCTURE -->
    <div class="section-block">
      <div class="section-title">
        <span>Infrastructure & Edge</span>
      </div>
      <div id="infraBadgesContainer" class="badges-row">
        <span class="empty-state-text">Tracing CDN edge & origin host...</span>
      </div>
    </div>

    <!-- CLIENT STORAGE -->
    <div class="section-block">
      <div class="section-title">
        <span>Client Footprint</span>
      </div>
      <div id="storageBadgesContainer" class="badges-row">
        <span class="badge badge-neutral" id="cookieMetric">0 Cookies</span>
        <span class="badge badge-neutral" id="storageMetric">0 LocalStorage</span>
      </div>
    </div>

    <!-- FOOTER -->
    <footer class="popup-footer">
      <button id="openDashboardBtn" class="btn-dashboard">
        <span>Open Deep Dashboard</span>
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="5" y1="12" x2="19" y2="12"></line>
          <polyline points="12 5 19 12 12 19"></polyline>
        </svg>
      </button>
    </footer>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
