<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Underweb — Website Intelligence</title>
  <link rel="stylesheet" href="../styles/theme.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="popup-header">
      <div class="brand">
        <div class="brand-icon">
          <img src="../../../assets/icons/icon32.png" alt="Underweb" width="20" height="20">
        </div>
        <div class="brand-text">
          <span class="brand-name">UNDERWEB</span>
          <span class="brand-tagline">WEBSITE INTELLIGENCE</span>
        </div>
      </div>
      <div id="protocolBadge" class="badge badge-cyan">DETACHED</div>
    </header>

    <!-- Target Site Info -->
    <div class="site-bar">
      <div class="site-host-wrap">
        <span id="siteProtocol" class="site-protocol">https://</span>
        <span id="siteHostname" class="site-host">Loading target...</span>
      </div>
      <span id="securityBadge" class="badge badge-emerald">SECURE</span>
    </div>

    <!-- Quick Stats Grid (Website DNA Snapshot) -->
    <div class="metrics-grid">
      <div class="metric-card">
        <span class="metric-val" id="totalRequests">0</span>
        <span class="metric-label">Requests</span>
      </div>
      <div class="metric-card">
        <span class="metric-val" id="domainsCount">0</span>
        <span class="metric-label">Domains</span>
      </div>
      <div class="metric-card">
        <span class="metric-val" id="thirdPartyCount">0</span>
        <span class="metric-label">3rd Party</span>
      </div>
      <div class="metric-card">
        <span class="metric-val" id="apiCount">0</span>
        <span class="metric-label">APIs</span>
      </div>
    </div>

    <!-- Detected Stack Summary -->
    <div class="section-block">
      <div class="section-title">
        <span>DETECTED STACK</span>
        <span id="techCountBadge" class="badge badge-slate">0</span>
      </div>
      <div id="techBadgesContainer" class="badges-row">
        <span class="empty-state-text">Scanning page runtime & headers...</span>
      </div>
    </div>

    <!-- Infrastructure & Delivery -->
    <div class="section-block">
      <div class="section-title">
        <span>INFRASTRUCTURE & CDN</span>
      </div>
      <div id="infraBadgesContainer" class="badges-row">
        <span class="empty-state-text">Detecting edge & origin...</span>
      </div>
    </div>

    <!-- Privacy & Storage -->
    <div class="section-block">
      <div class="section-title">
        <span>CLIENT STORAGE & PRIVACY</span>
      </div>
      <div id="storageBadgesContainer" class="badges-row">
        <span class="badge badge-slate" id="cookieMetric">0 Cookies</span>
        <span class="badge badge-slate" id="storageMetric">0 LocalStorage</span>
      </div>
    </div>

    <!-- Actions / Launch Dashboard -->
    <footer class="popup-footer">
      <button id="openDashboardBtn" class="btn btn-primary full-width">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
          <line x1="3" y1="9" x2="21" y2="9"></line>
          <line x1="9" y1="21" x2="9" y2="9"></line>
        </svg>
        OPEN DEEP INTELLIGENCE DASHBOARD
      </button>
    </footer>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
