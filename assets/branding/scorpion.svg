<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Clean Geometric Scorpion Exoskeleton Glyph -->
  <g class="scorpion-glyph" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Tail curved upward -->
    <path d="M16 15 C16 11 18 7 21 6 C23.5 5 25 7 24 9.5 C23 11 21 11.5 20.5 10" />
    <!-- Stinger tip -->
    <path d="M24 6.5 L24.8 5.2" stroke="#d97706" stroke-width="2" />
    
    <!-- Body Segments (Carapace) -->
    <ellipse cx="16" cy="18.5" rx="3" ry="4.5" fill="currentColor" fill-opacity="0.12" />
    <path d="M13.5 17 H18.5" />
    <path d="M13.8 19.5 H18.2" />
    
    <!-- Left Claw (Pedipalp) -->
    <path d="M13.5 16 C10.5 14.5 8.5 12.5 7.5 9.5" />
    <path d="M7.5 9.5 C6.5 8 5.5 8.5 6 10 C6.8 11.5 8 12 9.5 12.5" />
    <path d="M7.5 9.5 C8 7.5 9.5 7 10 8.5" />

    <!-- Right Claw (Pedipalp) -->
    <path d="M18.5 16 C21.5 14.5 23.5 12.5 24.5 9.5" />
    <path d="M24.5 9.5 C25.5 8 26.5 8.5 26 10 C25.2 11.5 24 12 22.5 12.5" />
    <path d="M24.5 9.5 C24 7.5 22.5 7 22 8.5" />

    <!-- Walking Legs (subtle, clean) -->
    <path d="M13 17.5 L9.5 18.5 L8 21" stroke-width="1.2" opacity="0.6" />
    <path d="M13.2 20 L10 21.5 L9 24" stroke-width="1.2" opacity="0.6" />
    <path d="M19 17.5 L22.5 18.5 L24 21" stroke-width="1.2" opacity="0.6" />
    <path d="M18.8 20 L22 21.5 L23 24" stroke-width="1.2" opacity="0.6" />
  </g>
</svg>