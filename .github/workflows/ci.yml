name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-validate:
    name: Test & Validate (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Run Zero-Dependency Unit Test Suite
        run: node tests/test-runner.js

      - name: Validate Technology Signatures & Zero Fabrication Rule
        run: node scripts/validate-signature.js

      - name: Verify Microsoft Edge Production Packaging
        run: node scripts/build-edge-package.js
