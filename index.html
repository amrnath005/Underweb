<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Underweb — Localhost Intelligence Portal</title>
  <link rel="stylesheet" href="src/ui/styles/theme.css">
  <style>
    body {
      background: var(--bg-void);
      color: #ffffff;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      font-family: var(--font-sans);
    }
    .portal-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--bg-primary);
      border-bottom: 1px solid var(--border-medium);
      padding: 10px 24px;
      height: 52px;
      box-sizing: border-box;
    }
    .portal-brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .portal-title {
      font-family: var(--font-display);
      font-size: 26px;
      letter-spacing: 0.08em;
      color: #ffffff;
      line-height: 1;
    }
    .portal-tagline {
      font-family: var(--font-mono);
      font-size: 9px;
      color: var(--text-cyan);
      letter-spacing: 0.1em;
    }
    .view-toggles {
      display: flex;
      gap: 8px;
    }
    .portal-frame-wrap {
      flex: 1;
      width: 100%;
      height: calc(100vh - 52px);
      display: flex;
      justify-content: center;
      align-items: stretch;
      background: var(--bg-void);
    }
    iframe {
      border: none;
      width: 100%;
      height: 100%;
    }
    .popup-preview-box {
      width: 420px;
      height: 600px;
      margin: 40px auto;
      border: 1px solid var(--border-medium);
      border-radius: var(--radius-sm);
      overflow: hidden;
      box-shadow: 0 0 30px rgba(0, 34, 255, 0.4);
    }
  </style>
</head>
<body>
  <header class="portal-bar">
    <div class="portal-brand">
      <img src="assets/branding/scorpion.svg" alt="Scorpion" width="30" height="30">
      <div>
        <div class="portal-title">UNDERWEB</div>
        <div class="portal-tagline">LOCALHOST INTELLIGENCE PORTAL // SCORPION RECON</div>
      </div>
    </div>
    <div class="view-toggles">
      <button id="btnViewDashboard" class="btn btn-electric btn-sm">[ FULL DASHBOARD ]</button>
      <button id="btnViewPopup" class="btn btn-outline btn-sm">[ EXTENSION POPUP PREVIEW ]</button>
    </div>
  </header>

  <div class="portal-frame-wrap" id="frameWrap">
    <iframe id="mainFrame" src="src/ui/dashboard/dashboard.html"></iframe>
  </div>

  <script>
    const frame = document.getElementById('mainFrame');
    const wrap = document.getElementById('frameWrap');
    const btnDash = document.getElementById('btnViewDashboard');
    const btnPop = document.getElementById('btnViewPopup');

    btnDash.addEventListener('click', () => {
      btnDash.className = 'btn btn-electric btn-sm';
      btnPop.className = 'btn btn-outline btn-sm';
      wrap.innerHTML = '<iframe id="mainFrame" src="src/ui/dashboard/dashboard.html"></iframe>';
    });

    btnPop.addEventListener('click', () => {
      btnPop.className = 'btn btn-electric btn-sm';
      btnDash.className = 'btn btn-outline btn-sm';
      wrap.innerHTML = '<div class="popup-preview-box"><iframe id="mainFrame" src="src/ui/popup/popup.html"></iframe></div>';
    });
  </script>
</body>
</html>
